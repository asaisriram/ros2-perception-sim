name: CI

on: push

jobs:
  basic_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: ROS2 availability check
        run: |
          source /opt/ros/jazzy/setup.bash
          ros2 pkg list
